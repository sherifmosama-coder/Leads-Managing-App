<style>
    .kanban-board { display: flex; gap: 20px; height: 100%; align-items: flex-start; padding-bottom: 20px; }
    .kanban-column { 
        min-width: 320px; width: 320px; max-height: 100%; display: flex; flex-direction: column;
        background: rgba(0,0,0,0.1); border-radius: 16px; padding: 15px;
        transition: background 0.3s ease;
    }
    [data-theme="light"] .kanban-column { background: rgba(255,255,255,0.4); }
    .kanban-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; font-weight: 600; }
    .kanban-cards { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-right: 5px; min-height: 150px; }
    
    /* Custom Scrollbar for Cards */
    .kanban-cards::-webkit-scrollbar { width: 6px; }
    .kanban-cards::-webkit-scrollbar-thumb { background: var(--glass-border-dark); border-radius: 10px; }
    [data-theme="light"] .kanban-cards::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); }
    
    /* Glassmorphism Cards */
    .kanban-card {
        background: var(--glass-bg-dark); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border-dark); border-radius: 12px; padding: 15px;
        cursor: grab; transition: all 0.2s ease;
    }
    [data-theme="light"] .kanban-card { background: var(--glass-bg-light); border: 1px solid var(--glass-border-light); }
    .kanban-card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-color: var(--primary); }
    [data-theme="light"] .kanban-card:hover { box-shadow: 0 8px 16px rgba(0,0,0,0.05); }
    .kanban-card:active { cursor: grabbing; transform: scale(0.98); }
    
    .card-title { font-weight: 600; font-size: 1.05em; margin-bottom: 5px; color: var(--text-dark); }
    [data-theme="light"] .card-title { color: var(--text-light); }
    .card-client { font-size: 0.85em; opacity: 0.7; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; font-weight: 500; border-top: 1px solid var(--glass-border-dark); padding-top: 10px; }
    [data-theme="light"] .card-footer { border-top: 1px solid rgba(0,0,0,0.1); }
    
    .deal-value { color: #10b981; font-weight: 600; }
    .deal-prob { opacity: 0.9; background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 10px; font-size: 0.8em; border: 1px solid var(--glass-border-dark); }
    [data-theme="light"] .deal-prob { background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); color: var(--text-light); }
    
    /* Drag and Drop Visual Feedback */
    .kanban-cards.drag-over { background: rgba(59, 130, 246, 0.1); border-radius: 12px; border: 1px dashed var(--primary); }
</style>

<script>
    // --- DASHBOARD TOAST LOGIC ---
    function showToast(message) {
        const toast = document.getElementById('dash-toast-container');
        if(toast) {
            document.getElementById('dash-toast-message').innerText = message;
            toast.classList.add('show');
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    }

    // --- KANBAN DATA ENGINE & RENDERING ---
    function loadPipelineView() {
        const workspace = document.getElementById('workspace');
        document.getElementById('view-title').innerText = "Pipeline Overview";
        
        // Show integrated loading state with modern spinner
        workspace.innerHTML = `
            <div style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.8;">
                <div class="spinner" style="margin-bottom: 20px; border-width: 3px; width: 50px; height: 50px;"></div>
                <h3 style="font-weight: 500;">Syncing Pipeline Engine...</h3>
            </div>
        `;

        // Grab user data from local storage to send to the server for row-level security
        const userData = JSON.parse(localStorage.getItem('crm_user')) || { email: '', role: '' };

        google.script.run
            .withSuccessHandler(function(response) {
                if(!response) {
                    Dialog.alert("System Error", "The server returned an empty response. Please check your spreadsheet headers for typos.");
                    workspace.innerHTML = '<div style="text-align:center; padding:50px; color:#ef4444;">Data Engine Failed.</div>';
                    return;
                }
                
                if(response.success) {
                    renderKanbanBoard(response.stages, response.deals);
                } else {
                    Dialog.alert("Data Error", response.message);
                    workspace.innerHTML = '<div style="text-align:center; padding:50px; color:#ef4444;">Failed to load data engine.</div>';
                }
            })
            .withFailureHandler(function(error) {
                Dialog.alert("Connection Error", "Could not reach the database.");
                workspace.innerHTML = '';
            })
            .getKanbanData(userData.email, userData.role);
    }

    function renderKanbanBoard(stages, deals) {
        const workspace = document.getElementById('workspace');
        let html = '<div class="kanban-board">';
        
        stages.forEach(stage => {
            const stageDeals = deals.filter(d => String(d.stage).trim() === String(stage.name).trim());
            const totalValue = stageDeals.reduce((sum, d) => sum + (Number(d.value) || 0), 0);
            const stageColor = stage.color || 'var(--primary)';
            
            html += `
                <div class="kanban-column" data-stage="${stage.name}">
                    <div class="kanban-header">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <div style="width:12px; height:12px; border-radius:50%; background:${stageColor}; box-shadow: 0 0 8px ${stageColor};"></div>
                            <span>${stage.name}</span>
                            <span style="opacity:0.7; font-size:0.8em; background:rgba(128,128,128,0.2); padding:3px 8px; border-radius:12px;">${stageDeals.length}</span>
                        </div>
                        <span style="font-size:0.9em; opacity:0.8; font-weight: 500;">$${totalValue.toLocaleString()}</span>
                    </div>
                    <div class="kanban-cards" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
            `;
            
            stageDeals.forEach(deal => {
                html += `
                        <div class="kanban-card" draggable="true" ondragstart="drag(event)" id="deal-${deal.id}" 
                             data-deal-id="${deal.id}"
                             data-assigned="${deal.assignedTo || ''}"
                             data-value="${deal.value || 0}"
                             data-prob="${deal.probability || 0}"
                             data-close="${deal.expectedClose ? new Date(deal.expectedClose).toISOString().split('T')[0] : ''}">
                            <div class="card-title">${deal.dealName || 'Unnamed Deal'}</div>
                            <div class="card-client"><i data-lucide="user" style="width:14px; height:14px;"></i> ${deal.contactName}</div>
                            <div class="card-footer">
                                <span class="deal-value">$${(Number(deal.value) || 0).toLocaleString()}</span>
                                <span class="deal-prob"><i data-lucide="target" style="width:12px; height:12px; display:inline-block; vertical-align:middle; margin-right:4px; margin-top:-2px;"></i>${deal.probability || 0}%</span>
                            </div>
                        </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
        });
        
        html += '</div>';
        workspace.innerHTML = html;
        lucide.createIcons(); // Re-initialize icons for the new HTML
    }

    // --- DRAG AND DROP LOGIC (Visual Frontend) ---
    function allowDrop(ev) { 
        ev.preventDefault(); 
        ev.currentTarget.classList.add('drag-over');
    }
    
    function dragLeave(ev) {
        ev.currentTarget.classList.remove('drag-over');
    }
    
    // Global variables to hold state during drag and modal overlay
    let activeDragCard = null;
    let originalColumn = null;

    function drag(ev) { 
        activeDragCard = ev.currentTarget;
        originalColumn = activeDragCard.parentElement; // Store where it came from
        ev.dataTransfer.setData("text", ev.currentTarget.id); 
        ev.currentTarget.style.opacity = "0.5";
    }
    
    function drop(ev) {
        ev.preventDefault();
        const dropzone = ev.currentTarget;
        dropzone.classList.remove('drag-over');
        const data = ev.dataTransfer.getData("text");
        const card = document.getElementById(data);
        if (!card || dropzone === originalColumn) return;

        dropzone.appendChild(card);
        const userData = JSON.parse(localStorage.getItem('crm_user'));

        // Fetch Modal Requirements (Agents & Currency)
        google.script.run.withSuccessHandler(function(req) {
            // Setup Agent Dropdown
            const agentSelect = document.getElementById('modal-assigned');
            agentSelect.innerHTML = req.agents.map(a => `<option value="${a}">${a}</option>`).join('');
            agentSelect.value = card.getAttribute('data-assigned');
            
            // Apply Permissions
            if(userData.role !== 'Admin') {
                agentSelect.disabled = true;
                document.getElementById('admin-only-note').style.display = 'block';
            } else {
                agentSelect.disabled = false;
                document.getElementById('admin-only-note').style.display = 'none';
            }

            // Setup Currency & Formats
            document.getElementById('modal-currency-badge').innerText = req.currency;
            document.getElementById('currency-prefix').innerText = req.currency === 'USD' ? '$' : req.currency;
            
            // Convert decimal 0.5 to whole 50 for the UI
            const rawProb = parseFloat(card.getAttribute('data-prob')) || 0;
            document.getElementById('modal-prob').value = rawProb < 1 ? rawProb * 100 : rawProb;
            
            document.getElementById('modal-value').value = card.getAttribute('data-value');
            document.getElementById('modal-stage').value = dropzone.closest('.kanban-column').getAttribute('data-stage');
            document.getElementById('move-modal-overlay').style.display = 'flex';
        }).getModalRequirements();
    }

    // --- MODAL BUTTON LOGIC ---
    function cancelDealMove() {
        // Snap back to original column
        if(activeDragCard && originalColumn) {
            originalColumn.appendChild(activeDragCard);
        }
        document.getElementById('move-modal-overlay').style.display = 'none';
        activeDragCard = null;
        originalColumn = null;
    }

    async function confirmDealMove() {
        if(!activeDragCard) return;
        
        const btn = document.getElementById('modal-save-btn');
        const fileInput = document.getElementById('modal-file');
        btn.innerText = "Processing...";
        btn.disabled = true;

        let fileUrl = "";

        // 1. معالجة رفع الملف أولاً (إن وجد)
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            fileUrl = await new Promise((resolve, reject) => {
                reader.onload = (e) => {
                    google.script.run
                        .withSuccessHandler(url => resolve(url))
                        .withFailureHandler(err => reject(err))
                        .uploadFileToDeal(e.target.result, file.name, activeDragCard.getAttribute('data-deal-id'));
                };
                reader.readAsDataURL(file);
            });
            showToast("File uploaded successfully!");
        }

        // 2. تجميع البيانات للحفظ النهائي
        const userData = JSON.parse(localStorage.getItem('crm_user'));
        const payload = {
            dealId: activeDragCard.getAttribute('data-deal-id'),
            newStage: document.getElementById('modal-stage').value,
            value: document.getElementById('modal-value').value,
            probability: document.getElementById('modal-prob').value,
            assignedTo: document.getElementById('modal-assigned').value,
            closeDate: document.getElementById('modal-close').value,
            noteText: document.getElementById('modal-note').value,
            attachmentUrl: fileUrl, // الرابط الجديد للملف
            userEmail: userData.email,
            userRole: userData.role
        };

        google.script.run
            .withSuccessHandler(function(response) {
                document.getElementById('move-modal-overlay').style.display = 'none';
                btn.innerText = "Confirm & Save";
                btn.disabled = false;
                
                if (response.success) {
                    showToast("Update Saved & Logged!");
                    setTimeout(loadPipelineView, 800);
                } else {
                    Dialog.alert("Error", response.message);
                    cancelDealMove();
                }
            })
            .withFailureHandler(err => {
                btn.disabled = false;
                Dialog.alert("System Error", err.message);
            })
            .processDealMove(payload);
    }

    // Set User details from localStorage
    function initDashboard() {
        const userData = JSON.parse(localStorage.getItem('crm_user'));
        if(userData) {
            document.getElementById('user-name-display').innerText = userData.name;
            document.getElementById('user-initial').innerText = userData.name.charAt(0).toUpperCase();
        }
    }

    // Standard reset function to clear active forms/memory when returning to main view
    function backToDashboard() {
        document.getElementById('workspace').innerHTML = ''; // Clear DOM
        localStorage.removeItem('current_form_config'); // Clear active form configuration
        sessionStorage.removeItem('active_record');
        loadPipelineView(); // Reload the pipeline automatically
    }

    function logout() {
        Dialog.confirm("Sign Out", "Are you sure you want to end your session?", 
            () => { // On Yes
                localStorage.removeItem('crm_user');
                location.reload(); // Reloads the URL to drop back to login doGet()
            },
            () => { // On No
                // Do nothing
            }
        );
    }

    // Run on load
    initDashboard();
    loadPipelineView(); // Fire the data engine immediately upon entry
</script>
